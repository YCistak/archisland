name: Bug report
description: Something is not working as expected
title: "bug: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: ArchIsland version or commit
      placeholder: "v0.1.0 or git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro
      placeholder: "CachyOS / Arch Linux"
    validations:
      required: true
  - type: input
    id: hyprland
    attributes:
      label: Hyprland version
      placeholder: "output of: hyprctl version"
    validations:
      required: true
  - type: input
    id: quickshell
    attributes:
      label: Quickshell version
      placeholder: "output of: quickshell --version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove personal information before posting.
      render: shell
    validations:
      required: true
