name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: shellcheck bin/island install.sh scripts/*.sh hooks/*.sh

  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Install Qt qmllint and git
        run: pacman -Syu --noconfirm qt6-declarative git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint QML (outside core/)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.qml' ':!core/**' | xargs /usr/lib/qt6/bin/qmllint
